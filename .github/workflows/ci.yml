name: Private CI

on:
  push:
    branches: [main]
    paths:
      - 'bin/**'
      - 'src/**'
      - 'test/**'
      - 'scripts/**'
      - 'examples/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'bin/**'
      - 'src/**'
      - 'test/**'
      - 'scripts/**'
      - 'examples/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  posix:
    name: Full suite / ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Full supported POSIX suite
        env:
          CI_ARTIFACT_DIR: ${{ runner.temp }}/sec-hub-ci-evidence
        run: node scripts/ci.mjs full
      - name: Fresh current-source candidate package smoke
        if: ${{ !cancelled() }}
        env:
          CI_ARTIFACT_DIR: ${{ runner.temp }}/sec-hub-ci-evidence
        run: node scripts/package-smoke.mjs
      - name: Preserve source-bound CI evidence and ephemeral candidate
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-candidate-${{ github.sha }}-${{ matrix.os }}-node${{ matrix.node }}
          path: ${{ runner.temp }}/sec-hub-ci-evidence
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Portable subset / Windows / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          architecture: x64
          package-manager-cache: false
      - name: Build the native Windows safe I/O helper
        shell: cmd
        env:
          CI_ARTIFACT_DIR: ${{ runner.temp }}/sec-hub-ci-evidence
        run: |
          @echo off
          set "SEC_HUB_VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          for /f "delims=" %%I in ('"%SEC_HUB_VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath') do set "SEC_HUB_VS=%%I"
          if not defined SEC_HUB_VS exit /b 1
          call "%SEC_HUB_VS%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=x64 -host_arch=x64 || exit /b 1
          cd /d "%GITHUB_WORKSPACE%" || exit /b 1
          mkdir "%CI_ARTIFACT_DIR%" || exit /b 1
          if exist "src\native\windows-safe-io.exe" del /f /q "src\native\windows-safe-io.exe"
          if exist "src\native\windows-safe-io.exe" exit /b 1
          cl.exe /nologo /std:c17 /MT /W4 /WX /O2 /DUNICODE /D_UNICODE /Fo"%RUNNER_TEMP%\windows-safe-io.obj" /Fe"src\native\windows-safe-io.exe" "src\native\windows-safe-io.c" advapi32.lib > "%CI_ARTIFACT_DIR%\windows-helper-build.log" 2>&1
          set "SEC_HUB_BUILD_STATUS=%ERRORLEVEL%"
          type "%CI_ARTIFACT_DIR%\windows-helper-build.log"
          if not "%SEC_HUB_BUILD_STATUS%"=="0" exit /b %SEC_HUB_BUILD_STATUS%
          if not exist "src\native\windows-safe-io.exe" exit /b 1
      - name: Portable units, native process trees and Windows safe I/O
        env:
          CI_ARTIFACT_DIR: ${{ runner.temp }}/sec-hub-ci-evidence
        run: node scripts/ci.mjs windows
      - name: Preserve portable-scope and native Windows evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-portable-${{ github.sha }}-windows-node${{ matrix.node }}
          path: ${{ runner.temp }}/sec-hub-ci-evidence
          if-no-files-found: error
          retention-days: 7

name: Private CI

on:
  push:
    branches: [main]
    paths:
      - 'bin/**'
      - 'src/**'
      - 'test/**'
      - 'scripts/**'
      - 'examples/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'bin/**'
      - 'src/**'
      - 'test/**'
      - 'scripts/**'
      - 'examples/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  posix:
    name: Full suite / ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CI_ARTIFACT_DIR: ${{ runner.temp }}/sec-hub-ci-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Full supported POSIX suite
        run: node scripts/ci.mjs full
      - name: Fresh current-source candidate package smoke
        if: ${{ !cancelled() }}
        run: node scripts/package-smoke.mjs
      - name: Preserve source-bound CI evidence and ephemeral candidate
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-candidate-${{ github.sha }}-${{ matrix.os }}-node${{ matrix.node }}
          path: ${{ env.CI_ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Portable subset / Windows / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      CI_ARTIFACT_DIR: ${{ runner.temp }}/sec-hub-ci-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Portable units, native process trees and Windows fail-closed file I/O
        run: node scripts/ci.mjs windows
      - name: Preserve portable-scope and native Windows evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-portable-${{ github.sha }}-windows-node${{ matrix.node }}
          path: ${{ env.CI_ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 7
